name: Sync pa-cafe skill

# skills/pa-cafe/SKILL.md is a copy. The source is pa-cafe/pa-cafe
# public/.well-known/agent-skills/pa-cafe/SKILL.md, published with a sha256 digest in
# https://pacafe.dnplus.dev/.well-known/agent-skills/index.json. This job downloads it,
# checks the digest, and opens (or refreshes) a PR when the copy differs.
on:
  schedule:
    - cron: "17 1 * * *" # daily, 09:17 Asia/Taipei
  workflow_dispatch:
    inputs:
      base_url:
        description: PA Cafe origin to read the index from
        default: https://pacafe.dnplus.dev

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-skill
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      BRANCH: sync/pa-cafe-skill
    steps:
      - uses: actions/checkout@v4

      - id: sync
        run: python3 scripts/sync_skill.py
        env:
          PA_CAFE_BASE_URL: ${{ inputs.base_url || 'https://pacafe.dnplus.dev' }}

      - if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.sync.outputs.digest }}
          SOURCE: ${{ steps.sync.outputs.source }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add skills/pa-cafe/SKILL.md
          git commit -m "Sync pa-cafe skill from PA Cafe ($DIGEST)"
          git push --force origin "$BRANCH"
          body="Copied from $SOURCE; digest $DIGEST matches the Agent Skills index. Source of truth: pa-cafe/pa-cafe public/.well-known/agent-skills/pa-cafe/SKILL.md. Generated by .github/workflows/sync-skill.yml."
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            gh pr edit "$BRANCH" --body "$body"
          else
            gh pr create --head "$BRANCH" --base "${{ github.event.repository.default_branch }}" \
              --title "Sync pa-cafe skill from PA Cafe" --body "$body"
          fi
